edition = "2021"
publish = false

[dependencies]
rustls = { git = "https://github.com/rustls/rustls.git", rev = "7768cd2b44049e040685d48318d13bfa7f7d32a8", default-features = false, features = [
  "ring",
  "std",
] }
rustls-pemfile = "2.2.0"
ring = "0.17.14"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
