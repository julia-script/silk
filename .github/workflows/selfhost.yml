name: Selfhost Silk

on:
  push:
    branches:
      - selfhost
  pull_request:
    branches:
      - selfhost

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Diagnostic test-root heap (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: base-d773184e
            ref: d773184e4db825480bbe9292971edb53a4858ed7
          - source: u8-88b74ddc
            ref: 88b74ddc016a29014efec438814dbfae2f5b095c
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Check main-first bootstrap provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/check-selfhost-bootstrap.mjs "$BASE_SHA" "$HEAD_SHA" origin/main
      - name: Record source and runner capacity
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          free -m
          df -h "$RUNNER_TEMP"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - name: Identify bootstrap inputs
        id: bootstrap-key
        shell: bash
        run: |
          set -euo pipefail
          digest=$(git ls-files -s -- packages/ scripts/ config/ .github/actions/setup-linux-llvm/ package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json .npmrc .node-version | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      # Turbo owns the dist output fingerprints. This archive is keyed by tracked bootstrap
      # inputs and the pinned Linux/Node/LLVM host, so native-only changes can replay builds.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: selfhost-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ steps.bootstrap-key.outputs.node }}-llvm22.1.8-${{ steps.bootstrap-key.outputs.digest }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bootstrap CLI
        run: CI=true node scripts/turbo.mjs run build --filter=@silklang/cli...
      - name: Measure SemanticCases compile
        timeout-minutes: 31
        env:
          PROBE_DIRECTORY: ${{ runner.temp }}/root-probe
          PROBE_SOURCE: ${{ matrix.ref }}
        run: |
          cat > "$RUNNER_TEMP/root-probe.mjs" <<'PROBE'
          import { spawn } from 'node:child_process'
          import * as fs from 'node:fs'
          import * as path from 'node:path'

          const directory = process.env.PROBE_DIRECTORY
          if (!directory) throw new Error('PROBE_DIRECTORY is required')
          fs.mkdirSync(directory, { recursive: true })
          const started = Date.now()
          const elapsed = () => (Date.now() - started) / 1000
          const write = (name, value) => fs.writeFileSync(path.join(directory, name), JSON.stringify(value))
          const record = (kind, value = {}) => {
            const row = { seconds: elapsed(), kind, ...value }
            fs.appendFileSync(path.join(directory, 'observations.jsonl'), JSON.stringify(row) + '\n')
            console.log('[ROOT-PROBE]', JSON.stringify(row))
          }

          // Emit compact evidence to the job log as well as artifacts, so runner termination
          // cannot erase already-completed CPU windows or the retained allocation checkpoint.
          const cpuSummary = profile => {
            const nodes = new Map(profile.nodes.map(node => [node.id, node.callFrame]))
            const totals = new Map()
            const samples = profile.samples ?? []
            for (let index = 0; index < samples.length; index += 1) {
              const frame = nodes.get(samples[index])
              if (!frame) continue
              const key = JSON.stringify(frame)
              const entry = totals.get(key) ?? { ...frame, microseconds: 0 }
              entry.microseconds += profile.timeDeltas?.[index] ?? 0
              totals.set(key, entry)
            }
            return [...totals.values()].sort((a, b) => b.microseconds - a.microseconds).slice(0, 30)
          }
          const allocationSummary = profile => {
            const entries = []
            const visit = (node, stack) => {
              const frames = [...stack, node.callFrame]
              if (node.selfSize) entries.push({ bytes: node.selfSize, frames: frames.slice(-10) })
              for (const child of node.children ?? []) visit(child, frames)
            }
            visit(profile.head, [])
            return {
              sampledObjects: profile.samples?.length ?? 0,
              estimatedBytes: entries.reduce((total, entry) => total + entry.bytes, 0),
              sites: entries.sort((a, b) => b.bytes - a.bytes).slice(0, 40),
            }
          }

          const child = spawn(process.execPath, ['--inspect-brk=127.0.0.1:0', '--trace-gc-nvp', ...process.argv.slice(2)], {
            detached: true,
            env: { ...process.env, NODE_OPTIONS: '--max-old-space-size=6144' },
            stdio: ['ignore', 'pipe', 'pipe'],
          })
          record('start', { source: process.env.PROBE_SOURCE, pid: child.pid, node: process.version })
          const bound = setTimeout(() => {
            record('timeout', { limitSeconds: 1800 })
            if (child.pid) process.kill(-child.pid, 'SIGKILL')
          }, 1800_000)
          let socket
          let requestId = 0
          const pending = new Map()
          let captured = false
          let requested = ''
          let connected = false
          let finished = false
          let pollBusy = false
          let rotating = false
          let rotation = 0
          let lastRotation = 0
          let paused
          let isPaused = false
          const scripts = new Map()
          let shutdownStarted = false
          const command = (method, params = {}, timeout = 120_000) => new Promise((resolve, reject) => {
            const id = ++requestId
            const timer = setTimeout(() => { pending.delete(id); reject(new Error(method + ' timed out')) }, timeout)
            pending.set(id, { resolve, reject, timer })
            socket.send(JSON.stringify({ id, method, params }))
          })
          const rotate = async () => {
            if (rotating) return
            rotating = true
            try {
              const cpu = await command('Profiler.stop')
              write('cpu-' + rotation + '.cpuprofile', cpu.profile)
              record('profile', { rotation, sites: cpuSummary(cpu.profile) })
              rotation += 1
              lastRotation = elapsed()
              if (!shutdownStarted) await command('Profiler.start')
            } finally { rotating = false }
          }
          const capture = async reason => {
            captured = true
            record('allocation-checkpoint-start', { reason })
            await rotate()
            await command('Debugger.enable')
            const framePromise = new Promise(resolve => { paused = resolve })
            await command('Debugger.pause')
            const frames = await Promise.race([
              framePromise,
              new Promise(resolve => setTimeout(() => resolve([]), 10_000)),
            ])
            write('checkpoint-stack.json', frames)
            record('checkpoint-stack', { frames: frames.slice(0, 12) })
            if (!isPaused) await command('Debugger.disable')
            try {
              const before = await command('Runtime.getHeapUsage')
              // The sampling-profile read forces GC. Take one deliberate checkpoint only;
              // avoid full snapshots: both first runners terminated during graph construction.
              const allocations = await command('HeapProfiler.getSamplingProfile')
              const after = await command('Runtime.getHeapUsage')
              const summary = allocationSummary(allocations.profile)
              write('checkpoint-allocations.heapprofile', allocations.profile)
              write('checkpoint-summary.json', { reason, seconds: elapsed(), before, after, ...summary })
              record('allocation-checkpoint-complete', { before, after, ...summary })
            } finally {
              if (isPaused) {
                await command('Debugger.resume')
                isPaused = false
                await command('Debugger.disable')
              }
            }
          }
          const connect = async url => {
            socket = new WebSocket(url)
            await new Promise((resolve, reject) => {
              socket.addEventListener('open', resolve, { once: true })
              socket.addEventListener('error', reject, { once: true })
            })
            socket.addEventListener('message', event => {
              const message = JSON.parse(event.data)
              if (message.id) {
                const waiter = pending.get(message.id)
                if (waiter) {
                  clearTimeout(waiter.timer)
                  pending.delete(message.id)
                  if (message.error) waiter.reject(new Error(JSON.stringify(message.error)))
                  else waiter.resolve(message.result)
                }
              } else if (message.method === 'Debugger.scriptParsed') scripts.set(message.params.scriptId, message.params.url)
              else if (message.method === 'Debugger.paused') {
                isPaused = true
                paused?.(message.params.callFrames.map(frame => ({
                  name: frame.functionName, url: frame.url || scripts.get(frame.location.scriptId), location: frame.location,
                })))
                paused = undefined
              }
            })
            socket.addEventListener('close', () => {
              for (const waiter of pending.values()) {
                clearTimeout(waiter.timer)
                waiter.reject(new Error('Inspector closed'))
              }
              pending.clear()
            })
            await command('Profiler.enable')
            await command('Profiler.setSamplingInterval', { interval: 2000 })
            await command('Profiler.start')
            await command('HeapProfiler.enable')
            await command('HeapProfiler.startSampling', { samplingInterval: 524288 })
            connected = true
            record('inspector-connected')
            await command('Runtime.runIfWaitingForDebugger')
          }
          const fail = error => { record('probe-error', { message: String(error) }); fs.appendFileSync(path.join(directory, 'probe-errors.log'), String(error) + '\n') }
          let stdout = ''
          child.stdout.on('data', bytes => {
            stdout += bytes.toString()
            const lines = stdout.split('\n')
            stdout = lines.pop() ?? ''
            for (const line of lines) {
              const jsonOffset = line.indexOf('GC: {')
              if (/pause=.*gc=/.test(line) || jsonOffset >= 0) {
                fs.appendFileSync(path.join(directory, 'gc.log'), line + '\n')
                const json = jsonOffset >= 0 ? JSON.parse(line.slice(jsonOffset + 4)) : undefined
                const after = json?.end_object_size ?? Number(line.match(/(?:end_object_size|total_size_after)=(\d+)/)?.[1] ?? 0)
                const major = json ? json.gc === 'ms' || json.gc === 'mc' : /gc=(?:ms|mc)\s/.test(line)
                if (major) record('major-gc', { liveBytes: after })
                if (!captured && major && after >= 4800 * 1024 * 1024)
                  requested = 'major-GC live bytes=' + after
              } else if (/Memory pool:|removed zone reservations:/.test(line)) {
                fs.appendFileSync(path.join(directory, 'gc.log'), line + '\n')
              } else {
                console.log(line)
                fs.appendFileSync(path.join(directory, 'test.log'), line + '\n')
                if (!captured && line.startsWith('Compiled ')) requested = 'compile receipt before native tests'
              }
            }
          })
          let stderr = ''
          child.stderr.on('data', bytes => {
            const text = bytes.toString()
            stderr += text
            fs.appendFileSync(path.join(directory, 'stderr.log'), text)
            process.stderr.write(text)
            const url = stderr.match(/ws:\/\/127\.0\.0\.1:\d+\/[^\s]+/)?.[0]
            if (url && !socket) connect(url).catch(fail)
            if (connected && text.includes('Waiting for the debugger to disconnect') && !shutdownStarted) {
              shutdownStarted = true
              rotate().then(async () => {
                const allocations = await command('HeapProfiler.getSamplingProfile')
                write('final-allocations.heapprofile', allocations.profile)
              }).catch(fail).finally(() => socket.close())
            }
          })
          const interval = setInterval(async () => {
            if (!connected || finished || pollBusy || shutdownStarted) return
            pollBusy = true
            try {
              const heap = await command('Runtime.getHeapUsage')
              const status = child.pid && fs.existsSync('/proc/' + child.pid + '/status')
                ? fs.readFileSync('/proc/' + child.pid + '/status', 'utf8') : ''
              record('heap', { ...heap, rssKiB: Number(status.match(/VmRSS:\s+(\d+)/)?.[1] ?? 0) })
              if (!captured && elapsed() >= Number(process.env.PROBE_CHECKPOINT_SECONDS ?? 540)) requested = 'fixed elapsed-time checkpoint'
              if (requested && !captured) await capture(requested)
              else if (elapsed() - lastRotation >= 120) await rotate()
            } catch (error) { fail(error) }
            finally { pollBusy = false }
          }, Number(process.env.PROBE_POLL_MS ?? 10_000))
          const exit = await new Promise(resolve => child.once('exit', (code, signal) => resolve({ code, signal })))
          finished = true
          clearInterval(interval)
          clearTimeout(bound)
          socket?.close()
          write('outcome.json', { ...exit, seconds: elapsed(), captured, source: process.env.PROBE_SOURCE })
          record('exit', exit)
          process.exitCode = exit.code ?? 1
          PROBE
          node "$RUNNER_TEMP/root-probe.mjs" packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/semantic/SemanticCases.silk --no-cache
      - name: Upload diagnostic summaries and stacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-root-heap-${{ matrix.source }}
          path: ${{ runner.temp }}/root-probe
          if-no-files-found: warn
          retention-days: 3
