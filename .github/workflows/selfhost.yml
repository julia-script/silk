name: B11 matched ordinal performance controls

on:
  push:
    branches:
      - selfhost
  pull_request:
    branches:
      - selfhost

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  silk:
    name: B11 ordinal branch controls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: 0c6665b48c53c7e7a8e0f3bc3840e647d68239b7
      - name: Check main-first bootstrap provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/check-selfhost-bootstrap.mjs "$BASE_SHA" "$HEAD_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - name: Identify bootstrap inputs
        id: bootstrap-key
        shell: bash
        run: |
          set -euo pipefail
          digest=$(git ls-files -s -- packages/ scripts/ config/ .github/actions/setup-linux-llvm/ package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json .npmrc .node-version | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      # Turbo owns the dist output fingerprints. This archive is keyed by tracked bootstrap
      # inputs and the pinned Linux/Node/LLVM host, so native-only changes can replay builds.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: selfhost-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ steps.bootstrap-key.outputs.node }}-llvm22.1.8-${{ steps.bootstrap-key.outputs.digest }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check selfhost corpus runner
        run: pnpm --filter @silklang/compiler exec tsx --test ../../compiler/scripts/runSelfhostCorpus.test.ts
      - name: Build bootstrap CLI
        run: CI=true node scripts/turbo.mjs run build --filter=@silklang/cli...
      # Temporary headroom until the bootstrap LLVM-emission memory fix lands (see memory handoff).
      - name: Build both fixed compiler revisions on this runner
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          BASELINE_REVISION: 937416c9769858e5b247a91b91c5a2fc1e453a1c
          MERGED_REVISION: 0c6665b48c53c7e7a8e0f3bc3840e647d68239b7
        run: |
          set -euo pipefail
          git diff --exit-code "$BASELINE_REVISION" "$MERGED_REVISION" -- packages/ scripts/ config/ .github/actions/setup-linux-llvm/ package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json .npmrc .node-version
          mkdir -p "$RUNNER_TEMP/b11-paired"
          lscpu > "$RUNNER_TEMP/b11-paired/host.txt"
          git checkout --detach "$BASELINE_REVISION"
          git rev-parse HEAD
          node packages/cli/dist/bin.js build --manifest-path compiler/silk.toml
          cp compiler/build/llvm/x86_64-unknown-linux-gnu/debug/silk-compiler "$RUNNER_TEMP/b11-paired/baseline-silkc"
          git checkout --detach "$MERGED_REVISION"
          git rev-parse HEAD
          node packages/cli/dist/bin.js build --manifest-path compiler/silk.toml
          cp compiler/build/llvm/x86_64-unknown-linux-gnu/debug/silk-compiler "$RUNNER_TEMP/b11-paired/merged-silkc"
          sha256sum "$RUNNER_TEMP/b11-paired/baseline-silkc" "$RUNNER_TEMP/b11-paired/merged-silkc" > "$RUNNER_TEMP/b11-paired/binaries.sha256"
      - name: Prepare repeated fresh-process controls
        run: |
          set -euo pipefail
          mkdir -p .scratch
          cat > .scratch/b11-paired.mjs <<'JS'
          import { createHash } from 'node:crypto'
          import { performance } from 'node:perf_hooks'
          import { writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { nativeCorpus } from '../packages/compiler/test/support/corpus.ts'
          import { runCase } from '../compiler/scripts/runSelfhostCorpus.ts'
          const names = [
            'sealed-scalar-intrinsics',
            'branch-otherwise',
            'branch-taken',
            'branch-else',
            'json-scanner',
          ]
          const revisions = {
            baseline: '937416c9769858e5b247a91b91c5a2fc1e453a1c',
            merged: '0c6665b48c53c7e7a8e0f3bc3840e647d68239b7',
          }
          const order = ['baseline', 'merged', 'merged', 'baseline']
          const directory = process.env.B11_DIRECTORY
          const outcomes = []
          const classification = (result) => JSON.stringify({
            status: result.status,
            code: result.code,
            gaps: result.gaps?.map(({ code }) => code).sort(),
          })
          for (const name of names) {
            const program = nativeCorpus.find((entry) => entry.name === name)
            if (program === undefined) throw new Error(`Missing corpus case: ${name}`)
            const fixture = JSON.stringify({
              source: program.nativeSource ?? program.source,
              imports: program.nativeImports ?? {},
              libraries: program.nativeDynamicLibraries ?? [],
              profiles: program.nativeProfiles ?? [],
              expected: program.expected,
              runs: program.nativeRuns ?? [],
            })
            const fixtureSha256 = createHash('sha256').update(fixture).digest('hex')
            writeFileSync(join(directory, `${name}.json`), fixture)
            for (const [ordinal, label] of order.entries()) {
              // Every invocation launches a fresh native compiler and temporary project.
              const started = performance.now()
              const result = runCase(join(directory, `${label}-silkc`), program)
              const outcome = {
                name,
                ordinal,
                label,
                source: revisions[label],
                fixtureSha256,
                elapsedMs: Math.round(performance.now() - started),
                result,
              }
              outcomes.push(outcome)
              console.log(`B11_PAIRED ${JSON.stringify(outcome)}`)
            }
          }
          writeFileSync(join(directory, 'results.json'), JSON.stringify(outcomes, null, 2))
          const inconsistent = names.some((name) => {
            const results = outcomes.filter((outcome) => outcome.name === name)
            return new Set(results.map(({ result }) => classification(result))).size !== 1
          })
          if (inconsistent || outcomes.some(({ result }) => result.status === 'fail')) process.exitCode = 1
          JS
      - name: Measure paired compiler controls with the original watchdog
        env:
          B11_DIRECTORY: ${{ runner.temp }}/b11-paired
        run: |
          set -o pipefail
          pnpm --filter @silklang/compiler exec tsx ../../.scratch/b11-paired.mjs | tee "$RUNNER_TEMP/b11-paired/control.log"
      - name: Upload paired performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b11-paired-controls
          path: |
            ${{ runner.temp }}/b11-paired/*.json
            ${{ runner.temp }}/b11-paired/*.log
            ${{ runner.temp }}/b11-paired/*.txt
            ${{ runner.temp }}/b11-paired/*.sha256
          retention-days: 3
