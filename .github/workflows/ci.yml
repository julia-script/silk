name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Spike (openspec/changes/spike-ci-test-sharding): the compiler vitest payload runs in the
  # compiler-tests matrix below; validate keeps everything else `pnpm check` ran.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Cache keys end in github.sha so every run saves a fresh cache; restore-keys
      # fall back to the newest cache whose lockfile/config hash still matches.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: node scripts/turbo.mjs run build
      - run: node scripts/turbo.mjs run typecheck
      - run: node scripts/turbo.mjs run test --filter='!@silklang/compiler'
      # The non-vitest parts of @silklang/compiler#test (its vitest payload is sharded below).
      - run: |
          pnpm --filter @silklang/compiler run unicode:check
          pnpm --filter @silklang/compiler run stdlib:check
          pnpm --filter @silklang/compiler run toolchain:check
          pnpm --filter @silklang/compiler run documentation:policy
          pnpm --filter @silklang/compiler run documentation:check
          pnpm --filter @silklang/compiler run documentation:examples
      - run: pnpm test:scripts
      - run: pnpm release:candidate

  # The native corpus is one serial file, so it shards by corpus index (SILK_NATIVE_SHARD in
  # DriverNativeAcceptance.test.ts) rather than by vitest --shard. The three scheduler-scale
  # cases are adjacent in the corpus, so index-mod-3 places one per shard.
  native-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      # Distinct per-shard keys avoid same-key save races; each shard restores its own newest
      # archive first (the one holding its cases' artifacts), then any native cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-na${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            silk-native-${{ runner.os }}-na${{ matrix.shard }}-
            silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build
      - run: pnpm --filter @silklang/compiler run test:native-acceptance
        env:
          SILK_NATIVE_SHARD: ${{ matrix.shard }}/3

  compiler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      # Restore-only: the native-executable cache is populated by test:native-acceptance in
      # validate; four shards saving the same key would race for nothing.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build
      # Mirrors test:parallel's flags; `pnpm --filter … run script -- args` drops the args
      # (observed in run 33014303799: every shard ran the full suite), so invoke vitest directly.
      - run: >
          pnpm --filter @silklang/compiler exec vitest run
          --passWithNoTests --exclude test/DriverNativeAcceptance.test.ts
          --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile.json=compiler-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # run_attempt suffix keeps reruns from colliding with v4's immutable artifact names.
          name: compiler-shard-${{ matrix.shard }}-timings-a${{ github.run_attempt }}
          path: packages/compiler/compiler-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  macos-native-os:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/compiler... run build
      - run: >
          pnpm --filter @silklang/compiler exec vitest run
          test/OsClockRuntime.test.ts test/OsRandomRuntime.test.ts
          -t 'runs the forced non-Linux absolute-deadline fallback harness|runs the forced macOS one-call exact-fill harness'
          --maxWorkers=1
      - run: >
          pnpm --filter @silklang/compiler exec vitest run test/DriverNativeAcceptance.test.ts
          -t 'links and runs the native system and monotonic clock ABI' --maxWorkers=1
      - run: >
          SILK_NATIVE_CORPUS_CASE=secure-random-provider
          pnpm --filter @silklang/compiler exec vitest run test/DriverNativeAcceptance.test.ts
          -t 'keeps the interpreter and native execution in agreement across the corpus'
          --maxWorkers=1

  webcontainer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/platform-webcontainer exec playwright install --with-deps chromium
      - run: pnpm --filter @silklang/platform-webcontainer test:browser
