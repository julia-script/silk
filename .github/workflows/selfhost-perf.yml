name: Selfhost CLI perf

# Measures the TypeScript CLI commands of selfhost.yml for a baseline and a candidate on the same
# ubuntu-latest runner, so the comparison shares hardware. Both compile the same pinned compiler/.
on:
  push:
    branches:
      - julia/nifty-hawking-2ezsnv-selfhost-perf

permissions:
  contents: read

env:
  SOURCES: 91b3e6552e0e8098dc2faf9b1756af3ad02adb70

jobs:
  measure:
    name: ${{ matrix.pair }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: base-vs-M
            base: 91b3e6552e0e8098dc2faf9b1756af3ad02adb70
            candidate: 109eff6ff55f1b6b160fea5cb534685ff2e10ef1
          - pair: I-vs-J
            base: 1a430e8720e2455a8cc4525ad90dadad3bb5a877
            candidate: 5953b00ebcbc7dcdbff758f49e99eef9ba762564
          - pair: J-vs-K
            base: 5953b00ebcbc7dcdbff758f49e99eef9ba762564
            candidate: a6c6547c6f56e0eca72354ae3333ec53b1a0c94f
          - pair: K-vs-L
            base: a6c6547c6f56e0eca72354ae3333ec53b1a0c94f
            candidate: 2fbb8d4165a1103c63a50c6e93a63e066cab9c41
          - pair: L-vs-M
            base: 2fbb8d4165a1103c63a50c6e93a63e066cab9c41
            candidate: 109eff6ff55f1b6b160fea5cb534685ff2e10ef1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.base }}
          path: base
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.candidate }}
          path: candidate
      - uses: actions/checkout@v6
        with:
          path: .perf
          sparse-checkout: .github
      - name: Pin compiler sources
        run: |
          for dir in base candidate; do
            git -C $dir fetch --quiet origin "$SOURCES"
            git -C $dir checkout "$SOURCES" -- compiler
            git -C $dir diff --quiet "$SOURCES" -- compiler
            echo "$dir head=$(git -C $dir rev-parse HEAD) sources=$SOURCES"
          done
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ./.perf/.github/actions/setup-linux-llvm
      - name: Build bootstrap CLIs
        run: |
          for dir in base candidate; do
            (cd $dir && pnpm install --frozen-lockfile && CI=true node scripts/turbo.mjs run build --filter=@silklang/cli...)
          done
      - name: Record runner
        run: |
          node --version
          clang --version | head -1
          nproc
          free -m | head -2
          grep -m1 'model name' /proc/cpuinfo
      - name: Measure selfhost CLI workload
        run: |
          bash .perf/.github/perf/measure.sh base=base candidate=candidate -- semantic target build m1 hir \
            | tee "$RUNNER_TEMP/measure.log"
      - name: Run selfhost native corpus
        working-directory: candidate
        run: |
          set -o pipefail
          pnpm --filter @silklang/compiler exec tsx ../../compiler/scripts/runSelfhostCorpus.ts | tee "$RUNNER_TEMP/selfhost-corpus.log"
        env:
          SILKC: ${{ github.workspace }}/candidate/compiler/build/llvm/x86_64-unknown-linux-gnu/release-with-debug/silk-compiler
      - name: Check corpus baseline
        run: node .perf/.github/perf/check-corpus.mjs "$RUNNER_TEMP/selfhost-corpus.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.pair }}"
            echo '```'
            grep -h -E '^SELFHOST_(CLI_TIMING|TEST_TIME_LIMIT_FAILED)' "$RUNNER_TEMP/measure.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
