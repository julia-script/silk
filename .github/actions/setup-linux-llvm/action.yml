name: Set up Linux LLVM
description: Install the verified LLVM release used by compiler and native acceptance tests.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: .scratch/llvm-22.1.8
        key: native-supply-llvm-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p .scratch/llvm-22.1.8
        if [ ! -x .scratch/llvm-22.1.8/bin/clang ]; then
          curl --fail --location --retry 3 https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz -o .scratch/llvm.tar.xz
          echo 'df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384  .scratch/llvm.tar.xz' | sha256sum -c -
          tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
        fi
        echo "$PWD/.scratch/llvm-22.1.8/bin" >> "$GITHUB_PATH"
        echo "SILK_TEST_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
        echo "SILK_TEST_LLVM_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar" >> "$GITHUB_ENV"
